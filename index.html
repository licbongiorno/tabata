<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Tabata Pro</title>
  <meta name="description" content="Temporizador Tabata optimizado, instalable offline y personalizable.">
  <meta name="theme-color" content="#0B0E11">
  <link id="pwa-manifest" rel="manifest" href="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app" id="app">
  <!-- Cabecera -->
  <header class="topbar">
    <div class="brand"><h1>Tabata Pro</h1></div>
    <div class="topbar-actions">
      <button class="btn-icon" id="btnStats" aria-label="Ver estadísticas">📊</button>
      <button class="btn-icon" id="btnSettings" aria-label="Ajustes">⚙️</button>
    </div>
  </header>

  <!-- Estado y Motivación -->
  <div class="phase-strip">
    <span class="phase-badge" id="phaseBadge" role="status" aria-live="polite">LISTO</span>
  </div>
  <p class="motivation" id="motivationText" aria-live="polite"></p>

  <!-- Reloj Central (GPU) -->
  <main class="clock-wrap">
    <div class="ring-holder">
      <svg class="ring-svg" viewBox="0 0 220 220" aria-hidden="true">
        <circle class="ring-track" cx="110" cy="110" r="100"></circle>
        <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="100"></circle>
      </svg>
      <div class="ring-center">
        <div class="time-display" id="timeDisplay" aria-label="Tiempo restante">00:00</div>
        <div class="round-line" id="roundLine">Configura tu entrenamiento</div>
      </div>
    </div>
  </main>

  <!-- Controles -->
  <div class="controls">
    <button class="btn-icon btn-large" id="btnStop" disabled aria-label="Detener y reiniciar">⏹</button>
    <button class="btn-primary" id="btnPlayPause">▶ Comenzar</button>
    <button class="btn-icon btn-large" id="btnPlus10" disabled aria-label="Sumar 10 segundos">+10s</button>
  </div>
</div>

<!-- Modal Configuración -->
<div class="modal-overlay" id="modalSettings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="modal">
    <h3 id="settingsTitle">Configuración</h3>
    <div class="settings-grid">
      <label>Prep. (s) <input type="number" id="inPrep" min="0" value="10"></label>
      <label>Trabajo (s) <input type="number" id="inWork" min="1" value="20"></label>
      <label>Descanso (s) <input type="number" id="inRest" min="0" value="10"></label>
      <label>Rondas <input type="number" id="inRounds" min="1" value="8"></label>
      <label>Ciclos <input type="number" id="inCycles" min="1" value="1"></label>
    </div>
    <div class="theme-toggle">
      <span>Modo Claro</span>
      <input type="checkbox" id="themeSwitch" aria-label="Alternar tema oscuro o claro">
    </div>
    <button class="btn-primary full-width" id="btnSaveSettings">Guardar y Aplicar</button>
  </div>
</div>

<!-- Modal Estadísticas -->
<div class="modal-overlay" id="modalStats" role="dialog" aria-modal="true">
  <div class="modal">
    <h3>Resumen del Día</h3>
    <div class="stats-display">
      <div class="stat-box">
        <span class="stat-num" id="statMinutes">0</span>
        <span class="stat-lbl">Min. Trabajo</span>
      </div>
    </div>
    <button class="btn-primary full-width" id="btnCloseStats" style="margin-top: 15px;">Cerrar</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
